<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="色と角度を調整してCSSグラデーションを作成するツール"><title>グラデーション作成</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="badge">GRADIENT MAKER</p><h1>グラデーション作成</h1><p>色・角度・種類を調整して、CSSコードを作れます。</p></div><a href="https://kentaro0810.github.io/secret-links/" class="home">リンク集へ戻る</a></header><section class="workspace"><div class="preview-panel"><div id="preview" class="preview"></div><div class="preview-actions"><button id="randomButton" class="sub">🎲 ランダム</button><button id="swapButton" class="sub">⇄ 色を入れ替え</button></div></div><div class="control-panel"><section><h2>グラデーションの種類</h2><div class="segmented"><button class="type active" data-type="linear">線形</button><button class="type" data-type="radial">円形</button></div></section><section id="angleSection"><div class="row-title"><h2>角度</h2><output id="angleOutput">135°</output></div><input id="angle" type="range" min="0" max="360" value="135"></section><section><h2>色</h2><div id="colors" class="colors"></div><button id="addColor" class="add">＋ 色を追加</button></section><section><h2>CSSコード</h2><div class="codebox"><code id="cssCode"></code><button id="copyButton">コピー</button></div><p id="message" class="message" aria-live="polite"></p></section></div></section><section class="presets"><div class="section-title"><div><p class="badge blue">PRESETS</p><h2>プリセット</h2></div><button id="resetButton" class="sub dark">初期状態へ戻す</button></div><div id="presetGrid" class="preset-grid"></div></section></main><script src="script.js"></script></body></html>
